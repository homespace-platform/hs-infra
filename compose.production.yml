services:
    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
        volumes:
            - hs-postgres-data:/var/lib/postgresql/data
            - type: bind
              source: ./postgres/init/01-create-databases.sql
              target: /docker-entrypoint-initdb.d/01-create-databases.sql
              read_only: true
              bind:
                  create_host_path: false
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
            interval: 10s
            timeout: 5s
            retries: 12

    postgres-ai:
        image: pgvector/pgvector:pg16
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_AI_DB:?Set POSTGRES_AI_DB}
            POSTGRES_USER: ${POSTGRES_AI_USER:?Set POSTGRES_AI_USER}
            POSTGRES_PASSWORD: ${POSTGRES_AI_PASSWORD:?Set POSTGRES_AI_PASSWORD}
        volumes:
            - hs-postgres-ai-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
            interval: 10s
            timeout: 5s
            retries: 12

    mongodb:
        image: mongo:7
        restart: unless-stopped
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set MONGO_INITDB_ROOT_USERNAME}
            MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:?Set MONGO_INITDB_DATABASE}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD}
        volumes:
            - hs-mongodb-data:/data/db
        healthcheck:
            test:
                - CMD-SHELL
                - >-
                    mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME"
                    --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin
                    --eval 'quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)'
            interval: 10s
            timeout: 5s
            retries: 12

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:?Set REDIS_PASSWORD}']
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
        volumes:
            - hs-redis-data:/data
        healthcheck:
            test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
            interval: 10s
            timeout: 5s
            retries: 12

    gotenberg:
        image: gotenberg/gotenberg:8
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:3000/health']
            interval: 10s
            timeout: 5s
            retries: 12

    kafka:
        image: apache/kafka:4.3.1
        restart: unless-stopped
        environment:
            CLUSTER_ID: ${KAFKA_CLUSTER_ID:?Set KAFKA_CLUSTER_ID}
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_LOG_DIRS: /var/lib/kafka/data
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_NUM_PARTITIONS: 3
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
        volumes:
            - hs-kafka-data:/var/lib/kafka/data
        healthcheck:
            test: ['CMD', '/opt/kafka/bin/kafka-broker-api-versions.sh', '--bootstrap-server', 'kafka:19092']
            interval: 10s
            timeout: 15s
            retries: 12
            start_period: 30s

    kafka-topics:
        image: apache/kafka:4.3.1
        restart: 'no'
        depends_on:
            kafka:
                condition: service_healthy
        entrypoint: ['/bin/sh', '-ec']
        command:
            - |
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$KAFKA_BOOTSTRAP_SERVER" --create --if-not-exists --topic "$$KEYCLOAK_KAFKA_TOPIC" --partitions 3 --replication-factor 1
                for topic in "$$KAFKA_EVENTS_TOPIC" "$$KAFKA_DLT_TOPIC" "$$KAFKA_NEWS_TOPIC" "$$KAFKA_NEWS_DLT_TOPIC"; do
                    /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$KAFKA_BOOTSTRAP_SERVER" --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
                done
        environment:
            KAFKA_BOOTSTRAP_SERVER: ${KAFKA_BOOTSTRAP_SERVER:?Set KAFKA_BOOTSTRAP_SERVER}
            KEYCLOAK_KAFKA_TOPIC: ${KEYCLOAK_KAFKA_TOPIC:?Set KEYCLOAK_KAFKA_TOPIC}
            KAFKA_EVENTS_TOPIC: ${KAFKA_EVENTS_TOPIC:?Set KAFKA_EVENTS_TOPIC}
            KAFKA_DLT_TOPIC: ${KAFKA_DLT_TOPIC:?Set KAFKA_DLT_TOPIC}
            KAFKA_NEWS_TOPIC: ${KAFKA_NEWS_TOPIC:?Set KAFKA_NEWS_TOPIC}
            KAFKA_NEWS_DLT_TOPIC: ${KAFKA_NEWS_DLT_TOPIC:?Set KAFKA_NEWS_DLT_TOPIC}

    keycloak:
        image: ${KEYCLOAK_IMAGE:?Set KEYCLOAK_IMAGE}
        pull_policy: always
        restart: unless-stopped
        command: ['start', '--optimized', '--import-realm']
        depends_on:
            postgres:
                condition: service_healthy
            kafka-topics:
                condition: service_completed_successfully
        environment:
            KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
            KC_DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
            KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
            KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME}
            KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
            KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?Set KEYCLOAK_HOSTNAME}
            KC_HOSTNAME_STRICT: ${KEYCLOAK_HOSTNAME_STRICT:?Set KEYCLOAK_HOSTNAME_STRICT}
            KC_HTTP_ENABLED: 'true'
            KC_PROXY_HEADERS: xforwarded
            KAFKA_BOOTSTRAP_SERVER: ${KAFKA_BOOTSTRAP_SERVER:?Set KAFKA_BOOTSTRAP_SERVER}
            KEYCLOAK_KAFKA_TOPIC: ${KEYCLOAK_KAFKA_TOPIC:?Set KEYCLOAK_KAFKA_TOPIC}
            JAVA_OPTS_APPEND: -Xms256m -Xmx512m
        healthcheck:
            test:
                - CMD
                - bash
                - -ec
                - |
                    exec 3<>/dev/tcp/127.0.0.1/9000
                    printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
                    read -r protocol status reason <&3
                    [[ "$$status" == 200 ]]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 90s

    pgadmin:
        image: dpage/pgadmin4:8
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
            postgres-ai:
                condition: service_healthy
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD}
        ports:
            - '127.0.0.1:5050:80'
        volumes:
            - hs-pgadmin-data:/var/lib/pgadmin
            - type: bind
              source: ./pgadmin/servers.json
              target: /pgadmin4/servers.json
              read_only: true
              bind:
                  create_host_path: false

    redis-insight:
        image: redis/redisinsight:3.8.0
        restart: unless-stopped
        depends_on:
            redis:
                condition: service_healthy
        ports:
            - '127.0.0.1:5540:5540'
        volumes:
            - hs-redis-insight-data:/data

    kafka-ui:
        image: provectuslabs/kafka-ui:v0.7.2
        restart: unless-stopped
        depends_on:
            kafka-topics:
                condition: service_completed_successfully
        ports:
            - '127.0.0.1:9022:9022'
        environment:
            SERVER_PORT: 9022
            KAFKA_CLUSTERS_0_NAME: HomeSpace
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_SERVER:?Set KAFKA_BOOTSTRAP_SERVER}


volumes:
    hs-postgres-data:
    hs-postgres-ai-data:
    hs-mongodb-data:
    hs-redis-data:
    hs-kafka-data:
    hs-pgadmin-data:
    hs-redis-insight-data:

networks:
    default:
        name: hs-network
        driver: overlay
        attachable: true
