services:
    #  =================================================================
    #  PostgreSQL
    #  =================================================================
    postgres:
        image: postgres:16-alpine
        container_name: hs-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-keycloak}
            POSTGRES_USER: ${POSTGRES_USER:-homespace}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homespace123}
        ports:
            - '5432:5432'
        volumes:
            - hs-postgres-data:/var/lib/postgresql/data
            - ./postgres/init:/docker-entrypoint-initdb.d:ro
        networks:
            - hs-network
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
            interval: 10s
            timeout: 5s
            retries: 5

    #  =================================================================
    #  PostgreSQL AI (pgvector for RAG)
    #  =================================================================
    postgres-ai:
        image: pgvector/pgvector:pg16
        container_name: hs-postgres-ai
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_AI_DB:-homespace_ai}
            POSTGRES_USER: ${POSTGRES_AI_USER:-homespace}
            POSTGRES_PASSWORD: ${POSTGRES_AI_PASSWORD:-homespace123}
        ports:
            - '5433:5432'
        volumes:
            - hs-postgres-ai-data:/var/lib/postgresql/data
        networks:
            - hs-network
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
            interval: 10s
            timeout: 5s
            retries: 5

    #  =================================================================
    #  MongoDB
    #  =================================================================
    mongodb:
        image: mongo:7
        container_name: hs-mongodb
        restart: unless-stopped
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-homespace}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-homespace123}
            MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-admin}
        ports:
            - '27017:27017'
        volumes:
            - hs-mongodb-data:/data/db
        networks:
            - hs-network
        healthcheck:
            test: ['CMD-SHELL', 'mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand(''ping'').ok"']
            interval: 10s
            timeout: 5s
            retries: 5

    #  =================================================================
    #  Redis
    #  =================================================================
    redis:
        image: redis:7-alpine
        container_name: hs-redis
        restart: unless-stopped
        command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-homespace123}
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:-homespace123}
        ports:
            - '6379:6379'
        volumes:
            - hs-redis-data:/data
        networks:
            - hs-network
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping']
            interval: 10s
            timeout: 5s
            retries: 5

    # DOCX -> PDF conversion required before VNPT SmartCA signing.
    # The core API runs on the host and calls http://localhost:3001.
    gotenberg:
        image: gotenberg/gotenberg:8
        container_name: hs-gotenberg
        restart: unless-stopped
        ports:
            - '127.0.0.1:3001:3000'
        networks:
            - hs-network
        healthcheck:
            test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:3000/health']
            interval: 10s
            timeout: 5s
            retries: 5

    #  =================================================================
    #  Kafka
    #  =================================================================
    kafka:
        image: apache/kafka:4.3.1
        container_name: hs-kafka
        restart: unless-stopped
        healthcheck:
            test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092']
            interval: 10s
            timeout: 15s
            retries: 5
            start_period: 30s
        ports:
            - '9092:9092'
        environment:
            # [Tổng quan]
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            # [Listener]
            # INTERNAL: container trong Docker kết nối qua kafka:19092
            # EXTERNAL: app trên máy host kết nối qua localhost:9092
            # CONTROLLER: cổng quản lý metadata
            KAFKA_LISTENERS: 'INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093'
            KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:19092,EXTERNAL://localhost:9092'
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
            # [Controller/Quorum]
            # Local 1 node: id=1, địa chỉ kafka:9093.
            KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
            # [Replication/Partition]
            # Local để 1 để khởi động nhanh, ít tốn tài nguyên.
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_NUM_PARTITIONS: 3
        volumes:
            - hs-kafka-data:/var/lib/kafka/data
        networks:
            - hs-network

    #  =================================================================
    #  Keycloak
    #  =================================================================
    keycloak:
        image: quay.io/keycloak/keycloak:26.5.2
        container_name: hs-keycloak
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    memory: 750M
        command: start --import-realm
        volumes:
            - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
            - ./keycloak/provider:/opt/keycloak/providers
            - ./keycloak/keycloak-themes:/opt/keycloak/themes:ro
        healthcheck:
            # Management port inside container = 9000 (host: http://localhost:9001/health/ready).
            # First boot builds custom providers then starts — allow up to ~5 min before failing.
            test: ['CMD-SHELL', "bash -ec \"exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | head -n 1 | grep -q 200\""]
            interval: 10s
            timeout: 5s
            retries: 30
            start_period: 240s
        depends_on:
            postgres:
                condition: service_healthy
            kafka:
                condition: service_healthy
        ports:
            - '9000:8080'
            - '9001:9000'
        environment:
            # Database
            KC_DB: postgres
            KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-keycloak}
            KC_DB_USERNAME: ${POSTGRES_USER:-homespace}
            KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-homespace123}
            # Keycloak
            # Chỉ tạo admin ở lần khởi động đầu tiên (khi master realm chưa tồn tại).
            KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-homespace}
            KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-homespace123}
            # SPI Config
            KAFKA_BOOTSTRAP_SERVER: ${KAFKA_BOOTSTRAP_SERVER:-kafka:19092}
            KEYCLOAK_KAFKA_TOPIC: ${KEYCLOAK_KAFKA_TOPIC:-keycloak-user-events}
            # Health & Metrics
            KC_HEALTH_ENABLED: 'true'
            KC_METRICS_ENABLED: 'true'
            KC_SPI_THEME_CACHE_THEMES: 'false'
            KC_SPI_THEME_CACHE_TEMPLATES: 'false'
            KC_SPI_THEME_STATIC_MAX_AGE: '-1'
            # Network
            # Keycloak 26 dùng Hostname v2 — bỏ hostname-strict-https (đã deprecate).
            KC_HTTP_ENABLED: 'true'
            KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
            KC_HOSTNAME_STRICT: ${KEYCLOAK_HOSTNAME_STRICT:-false}
            JAVA_OPTS_APPEND: -Xms256m -Xmx512m
        networks:
            - hs-network

volumes:
    hs-postgres-data:
        name: hs-postgres-data
    hs-mongodb-data:
        name: hs-mongodb-data
    hs-redis-data:
        name: hs-redis-data
    hs-kafka-data:
        name: hs-kafka-data
    hs-postgres-ai-data:
        name: hs-postgres-ai-data

networks:
    hs-network:
        name: hs-network
        driver: bridge

#  =================================================================
#  Usage
#  =================================================================
#  Start infrastructure (blocks until all healthchecks pass, incl. Keycloak :9000):
#    docker compose -f docker-infra.yml up -d --wait
#
#  Stop infrastructure:
#    docker compose -f docker-infra.yml down
#
#  Check Keycloak health manually:
#    curl -sf http://localhost:9001/health/ready
#
#  PostgreSQL:
#    Host in Docker: postgres
#    Host on local machine: localhost
#    Port: 5432
#    Databases: keycloak (Keycloak), homespace_core (modular monolith)
#    Username: homespace
#    Password: homespace123
#
#  MongoDB:
#    Host in Docker: mongodb
#    Host on local machine: localhost
#    Port: 27017
#    Username: homespace
#    Password: homespace123
#    Auth database: admin
#
#  Redis:
#    Host in Docker: redis
#    Host on local machine: localhost
#    Port: 6379
#    Username: leave empty
#    Password: homespace123
#
#  Kafka:
#    Bootstrap server in Docker: kafka:19092
#    Bootstrap server on local machine: localhost:9092
#
#  Keycloak:
#    URL: http://localhost:9000
#    Health: http://localhost:9001/health/ready
#    Admin username: homespace
#    Admin password: homespace123
