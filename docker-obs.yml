services:
    #  =================================================================
    #  pgAdmin
    #  =================================================================
    pgadmin:
        image: dpage/pgadmin4:8
        container_name: hs-pgadmin
        restart: unless-stopped
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-zolaracskh@gmail.com}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-homespace123}
            PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
        ports:
            - '5050:80'
        volumes:
            - hs-pgadmin-data:/var/lib/pgadmin
            - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
        networks:
            - hs-network

    #  =================================================================
    #  RedisInsight
    #  =================================================================
    redis-insight:
        image: redis/redisinsight:3.8.0
        container_name: hs-redis-insight
        restart: unless-stopped
        ports:
            - '5540:5540'
        volumes:
            - hs-redis-insight-data:/data
        networks:
            - hs-network

    #  =================================================================
    #  Kafka UI
    #  =================================================================
    kafka-ui:
        image: provectuslabs/kafka-ui:v0.7.2
        container_name: hs-kafka-ui
        restart: unless-stopped
        ports:
            - '9022:9022'
        environment:
            SERVER_PORT: 9022
            KAFKA_CLUSTERS_0_NAME: HomeSpace
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
        networks:
            - hs-network

volumes:
    hs-pgadmin-data:
        name: hs-pgadmin-data
    hs-redis-insight-data:
        name: hs-redis-insight-data

networks:
    hs-network:
        name: hs-network
        external: true

#  =================================================================
#  Usage
#  =================================================================
#  Start infrastructure first:
#    docker compose -f docker-infra.yml up -d --wait
#
#  Start observability tools:
#    docker compose -f docker-obs.yml up -d
#
#  Stop observability tools:
#    docker compose -f docker-obs.yml down
#
#  pgAdmin:
#    URL: http://localhost:5050
#    Login email: zolaracskh@gmail.com
#    Login password: homespace123
#    PostgreSQL Core host: postgres (port 5432, db: keycloak, user: homespace, pass: homespace123)
#    PostgreSQL AI (pgvector) host: postgres-ai (port 5432, db: homespace_ai, user: homespace, pass: homespace123)
#
#  RedisInsight:
#    URL: http://localhost:5540
#
#  Kafka UI:
#    URL: http://localhost:9022
#    Kafka bootstrap server from Docker network: kafka:19092
#
#  Connect RedisInsight to Redis from Docker network:
#    Host: redis
#    Port: 6379
#    Username: leave empty
#    Password: homespace123
#
#  Connect to Redis from an app running on local machine:
#    Host: localhost
#    Port: 6379
#    Username: leave empty
#    Password: homespace123
