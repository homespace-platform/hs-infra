name: Publish Keycloak image

on:
    push:
        branches: [master]
        paths:
            - .github/workflows/publish-keycloak.yml
            - Dockerfile.keycloak
            - keycloak/provider/**
            - keycloak/keycloak-themes/**
            - keycloak/realm-export.json
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: keycloak-image-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        if: github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Check Docker Hub credentials
              env:
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
              run: |
                  if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
                      echo '::error::Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in repository Actions secrets.'
                      exit 1
                  fi
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - uses: docker/build-push-action@v6
              with:
                  context: ./keycloak
                  file: ./Dockerfile.keycloak
                  platforms: linux/amd64
                  push: true
                  tags: |
                      nvminh162/homespace-keycloak:${{ github.sha }}
                      nvminh162/homespace-keycloak:latest
